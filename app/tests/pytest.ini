[pytest]
testpaths = app/tests
pythonpath = app
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

timeout = 30

markers =
    slow: testes de performance (mais demorados)
    integration: testes de integração com API
    unit: testes unitários
    smoke: testes rápidos de sanidade
    covered: perguntas cobertas pela base
    fallback: testes de fallback fora da base
    edge: casos limítrofes

addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes