services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ../python-agent-challenge/.env
    volumes:
      - /home/thaismajory/Documentos/thais_workspace/python-agent-challenge/app:/app
    working_dir: /app    
    depends_on:
      - redis
    restart: unless-stopped
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000

  redis:
    image: redis:7-alpine
    restart: unless-stopped